---
# /*---------------------------------------------------------------------------
# |                  Block Network Communication Test                          |
# +--------------------------------------------------------------------------*/
- name:                                 "Test Setup Tasks"
  ansible.builtin.include_tasks:        "roles/misc/tasks/test-case-setup.yml"
  run_once:                             true
  tags:                                 [pre-validation]

# /*---------------------------------------------------------------------------
# |                          Pre Validations                                  |
# +--------------------------------------------------------------------------*/
- name:                                 "Pre Validations: SCS Nodes"
  ansible.builtin.include_tasks:        "roles/misc/tasks/pre-validations-scs.yml"
  tags:                                 [pre-validation]

# /*---------------------------------------------------------------------------
# |                          Test Execution                                   |
# +--------------------------------------------------------------------------*/
- name:                                 "Test Execution: Block Network Communication"
  become:                               true
  when:                                 pre_validations_status == "PASSED"
  tags:                                 [test-execution]
  block:
    - name:                             "Test Execution: Block Network on ASCS Node"
      when:                             ansible_hostname == cluster_status_pre.ascs_node
      become:                           true
      tags:                             [test-execution]
      block:
        - name:                         "Test Execution: Start timer"
          ansible.builtin.set_fact:
            test_execution_start:       "{{ now(utc=true, fmt='%Y-%m-%d %H:%M:%S') }}"
            test_execution_hostname:    "{{ hostvars[cluster_status_pre.ascs_node].ansible_hostname }}"

        - name:                         "Test Execution: Get peer ERS node IP address"
          ansible.builtin.set_fact:
            ers_ip:                     "{{ hostvars[cluster_status_pre.ers_node].ansible_host }}"
          register:                     ers_ip_result

        - name:                         "Test Execution: Block network communication"
          ansible.builtin.shell: |
                                        set -o pipefail
                                        iptables -C INPUT -s {{ ers_ip }} -j DROP 2>/dev/null || \
                                          iptables -A INPUT -s {{ ers_ip }} -j DROP
                                        iptables -C OUTPUT -d {{ ers_ip }} -j DROP 2>/dev/null || \
                                          iptables -A OUTPUT -d {{ ers_ip }} -j DROP
          args:
            executable:                 /bin/bash
          register:                     block_network_result
          changed_when:                 true

        - name:                         "Test Execution: Wait for the cluster to be in a stable state"
          ansible.builtin.wait_for:
            timeout:                    "{{ default_timeout }}"


    - name:                             "Test Execution: Validate failover from ERS node (ASCS fenced scenario)"
      when:                             ansible_hostname == cluster_status_pre.ers_node
      become:                           true
      ignore_unreachable:               true
      tags:                             [test-execution]
      block:
        - name:                         "Test Execution: Validate SCS cluster status (failover check)"
          get_cluster_status_scs:
            sap_sid:                    "{{ sap_sid | lower }}"
          register:                     cluster_status_after_block
          retries:                      "{{ default_retries }}"
          delay:                        "{{ default_delay }}"
          until: >
                                        cluster_status_after_block.ascs_node != "" and
                                        cluster_status_after_block.ers_node != "" and
                                        (cluster_status_after_block.ascs_node != cluster_status_pre.ascs_node or
                                         cluster_status_after_block.ers_node != cluster_status_pre.ers_node)

        - name:                         "Test Execution: Store failover result from ERS node"
          ansible.builtin.set_fact:
            failover_detected_on_ers:   true
            cluster_status_test_execution: "{{ cluster_status_after_block }}"

    - name:                             "Test Execution: Validate failover from ASCS node (ERS fenced scenario)"
      when:                             ansible_hostname == cluster_status_pre.ascs_node
      become:                           true
      ignore_unreachable:               true
      tags:                             [test-execution]
      block:
        - name:                         "Test Execution: Validate SCS cluster status (failover check)"
          get_cluster_status_scs:
            sap_sid:                    "{{ sap_sid | lower }}"
          register:                     cluster_status_after_block
          retries:                      "{{ default_retries }}"
          delay:                        "{{ default_delay }}"
          until: >
                                        cluster_status_after_block.ascs_node != "" and
                                        cluster_status_after_block.ers_node != "" and
                                        (cluster_status_after_block.ascs_node != cluster_status_pre.ascs_node or
                                         cluster_status_after_block.ers_node != cluster_status_pre.ers_node)

        - name:                         "Test Execution: Store failover result from ASCS node"
          ansible.builtin.set_fact:
            failover_detected_on_ascs:  true
            cluster_status_test_execution: "{{ cluster_status_after_block }}"

    - name:                             "Test Execution: Remove iptables rules on ASCS node"
      when:                             ansible_hostname == cluster_status_pre.ascs_node
      become:                           true
      ignore_unreachable:               true
      tags:                             [test-execution]
      block:
        - name:                         "Test Execution: Restore network communication"
          ansible.builtin.shell: |
                                        iptables -D INPUT -s {{ ers_ip }} -j DROP 2>/dev/null || true
                                        iptables -D OUTPUT -d {{ ers_ip }} -j DROP 2>/dev/null || true
          args:
            executable:                 /bin/bash
          register:                     unblock_network_result
          changed_when:                 true
          failed_when:                  false

    - name:                             "Test Execution: Wait for the fenced node to rejoin"
      ansible.builtin.wait_for:
        timeout:                        "{{ ascs_stonith_timeout }}"
      tags:                             [test-execution]

    - name:                             "Test Execution: Validate full cluster recovery"
      become:                           true
      ignore_unreachable:               true
      tags:                             [test-execution]
      block:
        - name:                         "Test Execution: Validate SCS cluster status (post recovery)"
          get_cluster_status_scs:
            sap_sid:                    "{{ sap_sid | lower }}"
          register:                     cluster_status_post_recovery
          retries:                      "{{ default_retries }}"
          delay:                        "{{ default_delay }}"
          until: >
                                        cluster_status_post_recovery.ascs_node != "" and
                                        cluster_status_post_recovery.ers_node != "" and
                                        cluster_status_post_recovery.ascs_node == cluster_status_pre.ascs_node and
                                        cluster_status_post_recovery.ers_node == cluster_status_pre.ers_node

        - name:                         "Test Execution: Determine test execution status"
          ansible.builtin.set_fact:
            test_execution_status:      "{{ 'PASSED' if (
                                            cluster_status_post_recovery.ascs_node == cluster_status_pre.ascs_node and
                                            cluster_status_post_recovery.ers_node == cluster_status_pre.ers_node
                                          ) else 'FAILED' }}"
            cluster_status_test_execution: "{{ cluster_status_post_recovery }}"

        - name:                         "Test Execution: Cleanup resources"
          ansible.builtin.command:      crm_resource --cleanup
          register:                     cleanup_failed_resource_test_execution
          changed_when:                 cleanup_failed_resource_test_execution.rc == 0
          ignore_errors:                true

        - name:                         "Test Execution: Stop timer"
          ansible.builtin.set_fact:
            test_execution_end:         "{{ now(utc=true, fmt='%Y-%m-%d %H:%M:%S') }}"

        - name:                         "Set test case message and details"
          ansible.builtin.set_fact:
            test_case_message_from_test_case: |
                                        Old ASCS: {{ cluster_status_pre.ascs_node }}
                                        New ASCS: {{ cluster_status_test_execution.ascs_node }}
                                        Old ERS: {{ cluster_status_pre.ers_node }}
                                        New ERS: {{ cluster_status_test_execution.ers_node }}
            test_case_details_from_test_case: {
                                        "Pre Validations: Validate SCS cluster status": "{{ cluster_status_pre }}",
                                        "Pre Validations: CleanUp any failed resource": "{{ cleanup_failed_resource_pre | default('Not Executed') }}",
                                        "Test Execution: Block network": "{{ block_network_result | default('N/A') }}",
                                        "Test Execution: Unblock network": "{{ unblock_network_result | default('N/A') }}",
                                        "Test Execution: Cleanup resources": "{{ cleanup_failed_resource_test_execution | default('N/A') }}",
                                        "Post Validations Result": "{{ cluster_status_test_execution }}",
                                        }
# /*---------------------------------------------------------------------------
# |                          Post Validations                                 |
# +--------------------------------------------------------------------------*/
    - name:                             "Post Validations Tasks"
      ansible.builtin.include_tasks:    "roles/misc/tasks/post-validations.yml"
      tags:                             [post-validation]

  rescue:
    - name:                             "Test Execution Failure: Remove iptables rules on ASCS node"
      become:                           true
      ansible.builtin.shell: |
                                        iptables -D INPUT -s {{ ers_ip }} -j DROP 2>/dev/null || true
                                        iptables -D OUTPUT -d {{ ers_ip }} -j DROP 2>/dev/null || true
      args:
        executable:                     /bin/bash
      register:                         firewall_rule_deleted
      changed_when:                     firewall_rule_deleted.rc == 0
      failed_when:                      false
      ignore_unreachable:               true
      when:
                                        - ansible_hostname == cluster_status_pre.ascs_node
                                        - ers_ip is defined

    - name:                             "Rescue operation"
      ansible.builtin.include_tasks:    "roles/misc/tasks/rescue.yml"
      tags:                             [cleanup]

- name:                                 "Pre Validations: Test Case Skipped"
  become:                               true
  when:                                 pre_validations_status == "FAILED"
  block:
    - name:                             "Set test case message and details"
      ansible.builtin.set_fact:
        test_case_message_from_test_case: "Pre Validations for SCS cluster status checks failed. Please check the details."
        test_case_details_from_test_case: {
                                          "Pre Validations: Validate SCS cluster status": "{{ cluster_status_pre }}",
                                        }

    - name:                             "Post Validations Tasks"
      ansible.builtin.include_tasks:    "roles/misc/tasks/post-validations.yml"
      tags:                             [post-validation]
