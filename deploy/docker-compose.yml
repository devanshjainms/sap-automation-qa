services:
  sap-qa-service:
    build:
      context:            ..
      dockerfile:         deploy/Dockerfile
    container_name:       sap-qa-service
    user:                 "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart:              unless-stopped
    ports:
                          - "8000:8000"
    environment:
                          - LOG_FORMAT=${LOG_FORMAT:-json}
                          - LOG_LEVEL=${LOG_LEVEL:-INFO}
                          - SCHEDULER_CHECK_INTERVAL=${SCHEDULER_CHECK_INTERVAL:-60}
                          - PYTHONPATH=/app
                          - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
                          - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}
                          - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
                          - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
                          - STAF_MCP_URL=http://sap-mcp-server:8001
                          - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
                          - TELEMETRY_DATA_DESTINATION=${TELEMETRY_DATA_DESTINATION:-}
                          - LAWS_WORKSPACE_ID=${LAWS_WORKSPACE_ID:-}
                          - LAWS_SHARED_KEY=${LAWS_SHARED_KEY:-}
                          - LAWS_SUBSCRIPTION_ID=${LAWS_SUBSCRIPTION_ID:-}
                          - LAWS_RESOURCE_GROUP=${LAWS_RESOURCE_GROUP:-}
                          - LAWS_WORKSPACE_NAME=${LAWS_WORKSPACE_NAME:-}
                          - ADX_DATABASE_NAME=${ADX_DATABASE_NAME:-}
                          - ADX_CLUSTER_FQDN=${ADX_CLUSTER_FQDN:-}
                          - ADX_CLIENT_ID=${ADX_CLIENT_ID:-}
    volumes:
                          - sap-qa-data:/app/data
                          - ../WORKSPACES:/app/WORKSPACES
                          - ../vars.yaml:/app/vars.yaml:ro
    depends_on:
      sap-mcp-server:
        condition:        service_healthy
    healthcheck:
      test:               ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval:           30s
      timeout:            10s
      retries:            3
      start_period:       10s
    networks:
                          - sap-qa-network
    logging:
      driver:             "json-file"
      options:
        max-size:         "10m"
        max-file:         "3"

  sap-mcp-server:
    build:
      context:            ..
      dockerfile:         deploy/Dockerfile
    container_name:       sap-mcp-server
    user:                 "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart:              unless-stopped
    command:              ["uvicorn", "src.mcp_server.server:http_app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
                          - "8001:8001"
    environment:
                          - LOG_FORMAT=${LOG_FORMAT:-json}
                          - LOG_LEVEL=${LOG_LEVEL:-INFO}
                          - PYTHONPATH=/app
                          - MCP_HOST=0.0.0.0
                          - MCP_PORT=8001
                          - CORE_API_URL=http://sap-qa-service:8000
                          - DATA_DIR=/app/data
                          - WORKSPACES_BASE=/app/WORKSPACES/SYSTEM
                          - AZURE_OPENAI_EMBEDDING_ENDPOINT=${AZURE_OPENAI_EMBEDDING_ENDPOINT:-}
                          - AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
                          - AZURE_OPENAI_EMBEDDING_API_KEY=${AZURE_OPENAI_EMBEDDING_API_KEY:-}
                          - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
                          - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
                          - MCP_AUTH_MODE=${MCP_AUTH_MODE:-none}
                          - MCP_API_KEY=${MCP_API_KEY:-}
                          - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN:-}
                          - MCP_RATE_LIMIT_RPM=${MCP_RATE_LIMIT_RPM:-60}
    volumes:
                          - sap-qa-data:/app/data
                          - ../WORKSPACES:/app/WORKSPACES
    healthcheck:
      test:               ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/mcp | grep -qE '^[2-5]'"]
      interval:           30s
      timeout:            10s
      retries:            3
      start_period:       10s
    networks:
                          - sap-qa-network
    logging:
      driver:             "json-file"
      options:
        max-size:         "10m"
        max-file:         "3"

  sap-ui:
    build:
      context:            ..
      dockerfile:         deploy/Dockerfile.ui
    container_name:       sap-ui
    restart:              unless-stopped
    ports:
                          - "3000:3000"
    depends_on:
      sap-qa-service:
        condition:        service_healthy
    networks:
                          - sap-qa-network
    healthcheck:
      test:               ["CMD", "curl", "-f", "http://localhost:3000"]
      interval:           30s
      timeout:            10s
      retries:            3
      start_period:       10s
    logging:
      driver:             "json-file"
      options:
        max-size:         "10m"
        max-file:         "3"

  sap-devui:
    build:
      context:            ..
      dockerfile:         deploy/Dockerfile
    container_name:       sap-devui
    user:                 "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart:              unless-stopped
    command:              ["python", "-m", "src.devui.server", "--host", "0.0.0.0", "--port", "8080", "--no-open"]
    ports:
                          - "8080:8080"
    environment:
                          - PYTHONPATH=/app
                          - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
                          - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}
                          - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
                          - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
    depends_on:
      sap-qa-service:
        condition:        service_healthy
    networks:
                          - sap-qa-network
    logging:
      driver:             "json-file"
      options:
        max-size:         "10m"
        max-file:         "3"

volumes:
  sap-qa-data:
    driver:               local

networks:
  sap-qa-network:
    driver:               bridge
