# Entry point for the ha_scs role.
# Includes the appropriate task file based on the 'test_case_name' variable.
#
# Usage:
#   roles:
#     - role: ha_scs
#       vars:
#         test_case_name: ha-config

- name:                                 "ha_scs: Execute test case"
  ansible.builtin.include_tasks:        "{{ test_case_name }}.yml"
  when:                                 test_case_name is defined
