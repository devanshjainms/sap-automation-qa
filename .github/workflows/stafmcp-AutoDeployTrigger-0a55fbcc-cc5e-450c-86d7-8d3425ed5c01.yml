name: Trigger auto deployment for stafmcp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ mcp-sre-agent ]
    paths:
    - '**'
    - '.github/workflows/stafmcp-AutoDeployTrigger-0a55fbcc-cc5e-450c-86d7-8d3425ed5c01.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.STAFMCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.STAFMCP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.STAFMCP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.STAFMCP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.STAFMCP_REGISTRY_PASSWORD }}
          containerAppName: stafmcp
          resourceGroup: devanshjain-rg
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


