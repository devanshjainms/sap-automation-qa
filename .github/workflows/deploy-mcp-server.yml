name:                         Deploy MCP Server to Container App

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description:          "Azure resource group"
        required:             true
        type:                 string
      container_app_name:
        description:          "Container App name"
        required:             true
        default:              "staf-mcp"
        type:                 string
      acr_name:
        description:          "Azure Container Registry name"
        required:             true
        type:                 string

permissions:
  contents:                   read
  id-token:                   write

jobs:
  deploy:
    runs-on:                  ubuntu-latest
    steps:
      - name:                 Checkout repository
        uses:                 actions/checkout@v4

      - name:                 Azure Login
        uses:                 azure/login@v2
        with:
          client-id:          ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:          ${{ secrets.AZURE_TENANT_ID }}
          subscription-id:    ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
                              az acr build \
                                --registry ${{ inputs.acr_name }} \
                                --image ${{ inputs.container_app_name }}:${{ github.sha }} \
                                --image ${{ inputs.container_app_name }}:latest \
                                --file Dockerfile .

      - name: Deploy to Container App
        run: |
                              az containerapp update \
                                --name ${{ inputs.container_app_name }} \
                                --resource-group ${{ inputs.resource_group }} \
                                --image ${{ inputs.acr_name }}.azurecr.io/${{ inputs.container_app_name }}:${{ github.sha }}
