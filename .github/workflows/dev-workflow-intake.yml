name: Dev Workflow Intake

on:
  issues:
    types: [labeled]

jobs:
  intake:
    if: github.event.label.name == 'workflow:intake'
    runs-on: ubuntu-latest
    steps:
      - name: Assign Copilot coding agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/assignees \
            --method POST \
            -f 'assignees[]=copilot'
