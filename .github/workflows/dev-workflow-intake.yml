name: Dev Workflow Intake

on:
  issues:
    types: [labeled]

jobs:
  intake:
    if: github.event.label.name == 'workflow:intake'
    runs-on: ubuntu-latest
    steps:
      - name: Assign Copilot coding agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: gh issue edit ${{ github.event.issue.number }} --add-assignee copilot --repo ${{ github.repository }}
