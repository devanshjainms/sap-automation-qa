# Template: SAP Cluster Incident Response Plan for Azure SRE Agent
# Usage: Builder → Incident Response Plans → New Plan (paste this config)
#
# This plan routes SAP-related Azure Monitor alerts to the SAP Expert custom
# agent for automated triage.  Adjust the "impacted_services" list to match
# your subscription's SAP service names.

---
# Human-readable plan name shown in the SRE Agent portal.
name: SAP Cluster Incident Response

# Short description surfaced in the plan list and audit log entries.
description: >-
  Automatically triages P1/P2 incidents that affect SAP HANA, Central Services,
  or Pacemaker clusters running on Azure.  The plan invokes the sap_expert
  custom agent to collect evidence, run analysis, and produce a triage report.

# ---------------------------------------------------------------------------
# Alert matching — only incidents that satisfy ALL filters trigger this plan.
# ---------------------------------------------------------------------------

filters:
  # Severity filter — restrict to business-critical and production-impacting.
  # P1 = critical (service down), P2 = high (degraded service).
  severity:
    - P1
    - P2

  # Title keyword filter — the incident title must contain at least one of
  # these terms (case-insensitive).  Add product-specific terms as needed.
  title_contains:
    - SAP
    - HANA
    - Pacemaker
    - SCS
    - ASCS
    - ERS
    - cluster
    - corosync
    - stonith

  # Impacted service filter — list the Azure service names or resource groups
  # that host your SAP landscape.  Replace the placeholders below with real
  # values from your subscription.
  impacted_services:
    - "<your-sap-hana-service>"        # e.g. "sap-hana-prod-eus2"
    - "<your-sap-scs-service>"         # e.g. "sap-scs-prod-eus2"
    - "<your-sap-app-service>"         # e.g. "sap-app-prod-eus2"

# ---------------------------------------------------------------------------
# Response configuration
# ---------------------------------------------------------------------------

response:
  # The custom agent that handles incidents matching this plan.
  # "sap_expert" must be registered in Builder → Custom Agents.
  agent: sap_expert

  # Autonomy level controls how much the agent can do without human approval.
  #   "review"     — agent investigates and proposes actions; a human must
  #                  approve before any remediation is executed.
  #   "autonomous" — agent investigates AND executes approved runbooks without
  #                  waiting for human approval.
  #
  # Start with "review" until you have validated the agent's triage accuracy
  # over at least 20 incidents.  Switch to "autonomous" only for well-tested
  # runbooks with rollback capability (e.g. resource-migration, manual-restart).
  autonomy_level: review

  # Maximum time (ISO 8601 duration) the agent may spend investigating before
  # escalating to a human.
  investigation_timeout: PT30M

# ---------------------------------------------------------------------------
# Reinvestigation cooldown — prevents alert storms from triggering duplicate
# investigations for the same underlying issue.
# ---------------------------------------------------------------------------

reinvestigation:
  # Enable cooldown to suppress duplicate investigations within the window.
  enabled: true

  # Cooldown window — a new alert for the same resource is suppressed if an
  # investigation completed less than 3 hours ago.  Tune this value based on
  # your SLA and typical MTTR.
  cooldown: PT3H

# ---------------------------------------------------------------------------
# Notification channels — optional; configure in Builder → Integrations.
# ---------------------------------------------------------------------------

notifications:
  # Teams channel or Slack webhook for investigation status updates.
  channels:
    - "<your-teams-channel-or-webhook>"

  # Notify on these lifecycle events.
  events:
    - investigation_started
    - action_proposed
    - investigation_completed
    - escalation_required
